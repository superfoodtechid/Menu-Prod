services:
  menu-postgres:
    image: postgres:16-alpine
    container_name: foodmaster-menu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MENU_POSTGRES_DB:-foodmaster_menu}
      POSTGRES_USER: ${MENU_POSTGRES_USER:-foodmaster_menu}
      POSTGRES_PASSWORD: ${MENU_POSTGRES_PASSWORD:-change-this-in-production}
    ports:
      # Keep the database private by default. Set MENU_POSTGRES_BIND_IP to
      # the VM1 Tailscale IP when the Raspberry Pi worker is ready.
      - "${MENU_POSTGRES_BIND_IP:-127.0.0.1}:${MENU_POSTGRES_PORT:-55432}:5432"
    volumes:
      - menu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - foodmaster-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodmaster-backend
    restart: unless-stopped
    init: true
    depends_on:
      menu-postgres:
        condition: service_healthy
    shm_size: '2gb'
    userns_mode: keep-id
    environment:
      - HOME=/tmp
      - SE_CACHE_PATH=/tmp/.cache/selenium
      - WDM_DIR=/tmp/.wdm
      - HEADLESS_GOFOOD=${HEADLESS_GOFOOD:-true}
      - GOFOOD_EXTRACTION_TIMEOUT_SECONDS=${GOFOOD_EXTRACTION_TIMEOUT_SECONDS:-900}
      - PULL_EXTRACTION_TIMEOUT_SECONDS=${PULL_EXTRACTION_TIMEOUT_SECONDS:-900}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:18800:8000"
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./main.py:/app/main.py
      - ./login_gofood.py:/app/login_gofood.py
      - ./O. C5 .xlsx:/app/O. C5 .xlsx:ro
      - ./Gofood:/app/Gofood
      - ./shopee:/app/shopee
      - ./grab:/app/grab
      - ./menu_core:/app/menu_core
      - ./src:/app/src
      - ./src/shopee-omzet-automation/data:/app/src/shopee-omzet-automation/data
    networks:
      - foodmaster-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodmaster-worker-vm1
    restart: unless-stopped
    init: true
    depends_on:
      menu-postgres:
        condition: service_healthy
    shm_size: '2gb'
    userns_mode: keep-id
    environment:
      - HOME=/tmp
      - SE_CACHE_PATH=/tmp/.cache/selenium
      - WDM_DIR=/tmp/.wdm
      - HEADLESS_GOFOOD=${HEADLESS_GOFOOD:-true}
      - WORKER_ID=vm1
      - WORKER_POLL_SECONDS=${WORKER_POLL_SECONDS:-3}
      - WORKER_LEASE_SECONDS=${WORKER_LEASE_SECONDS:-7200}
      - WORKER_AUTO_DELAY_SECONDS=0
    command: ["python", "worker.py"]
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./main.py:/app/main.py
      - ./login_gofood.py:/app/login_gofood.py
      - ./O. C5 .xlsx:/app/O. C5 .xlsx:ro
      - ./Gofood:/app/Gofood
      - ./shopee:/app/shopee
      - ./grab:/app/grab
      - ./menu_core:/app/menu_core
      - ./src:/app/src
      - ./src/shopee-omzet-automation/data:/app/src/shopee-omzet-automation/data
    networks:
      - foodmaster-network

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: foodmaster-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - foodmaster-network

networks:
  foodmaster-network:
    driver: bridge

volumes:
  menu_postgres_data:
