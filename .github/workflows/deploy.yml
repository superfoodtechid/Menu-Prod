name: Auto Deploy FoodMaster (Frontend & Backend)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy FoodMaster (Frontend & Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend Production Dist
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY || 'foodmaster-secret-api-key-2026' }}
        run: |
          cd web
          npm ci
          npm run build

      - name: Deploy Frontend Dist & Update Backend via SSH
        env:
          SSH_KEY: ${{ secrets.DO_VPS_SSH_KEY }}
          HOST: ${{ secrets.DO_VPS_HOST }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: DO_VPS_SSH_KEY secret is empty or missing!"
            exit 1
          fi
          if [ -z "$HOST" ]; then
            echo "ERROR: DO_VPS_HOST secret is empty or missing!"
            exit 1
          fi
          mkdir -p ~/.ssh
          python3 -c "import os, base64; k=os.environ.get('SSH_KEY',''); out=k.replace('\r','') if 'BEGIN' in k else (base64.b64decode(k.strip()).decode('utf-8') if k.strip() else ''); open('/home/runner/.ssh/id_ed25519','w').write(out.strip()+'\n')"
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -l -f ~/.ssh/id_ed25519 || { echo "ERROR: Invalid SSH private key format!"; exit 1; }
          ssh-keyscan -p 2222 "$HOST" >> ~/.ssh/known_hosts
          rsync -avz -e "ssh -p 2222 -o StrictHostKeyChecking=no" --delete web/dist/ "pi@$HOST":/home/pi/project/menu-prod/web/dist/
          ssh -p 2222 -o StrictHostKeyChecking=no pi@$HOST "cd /home/pi/project/menu-prod && git fetch origin main && git reset --hard origin/main && [ -f .env ] || cp .env.example .env && mkdir -p src/goscrapperv2 && [ -f src/goscrapperv2/.env ] || cp .env src/goscrapperv2/.env && sudo DOCKER_BUILDKIT=1 docker build -t foodmaster-backend-api:latest . && (sudo docker rm -f foodmaster_backend_container 2>/dev/null || true) && sudo docker run -d --name foodmaster_backend_container --init --restart unless-stopped --net=host -v /home/pi/project/menu-prod/data:/app/data -v /home/pi/project/menu-prod/.env:/app/.env -v /home/pi/project/menu-prod/src/goscrapperv2/.env:/app/src/goscrapperv2/.env foodmaster-backend-api:latest"
